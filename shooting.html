<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shooting Photo 2026 - La Récré Du P'tit Loup</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="shooting.css">

</head>

<body>

<div class="card">

    <h1>📸 Shooting Photo</h1>

    <p id="dateEvenement">
        21 octobre 2026
    </p>

   <div id="contenu">

<form id="formulaire">

<div class="section">

<h2>👨 Responsable</h2>

<div class="grid">

<div>
<label>Nom</label>
<input type="text" id="nom">
</div>

<div>
<label>Prénom</label>
<input type="text" id="prenom">
</div>

<div>
<label>Téléphone</label>
<input type="tel" id="telephone">
</div>

<div>
<label>Email</label>
<input type="email" id="email">
</div>

</div>

</div>

<div class="section">

<h2>👶 Enfants</h2>

<div id="listeEnfants">

</div>

<button type="button" id="ajouterEnfant">

➕ Ajouter un enfant

</button>

</div>

<div class="section">

<h2>📸 Type de séance</h2>

<select id="typePhoto">

<option value="individuel">Photo individuelle</option>

<option value="fratrie">Photo fratrie</option>

<option value="les2">Individuelle + Fratrie</option>

</select>

</div>

<div class="section">

<h2>🕒 Créneau</h2>

<div id="creneaux">

Les créneaux apparaîtront ici.

</div>

</div>

<br>

<button type="submit">

Valider mon inscription

</button>

</form>

</div>

      

    </div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shooting.js"></script>

</body>
</html>
