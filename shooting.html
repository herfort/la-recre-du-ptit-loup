<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shooting Photo 2026 - La Récré Du P'tit Loup</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="shooting.css">

</head>

<body>

<div class="card">

    <h1>📸 Shooting Photo</h1>

    <p id="dateEvenement">
        21 octobre 2026
    </p>

   <div id="contenu">

<form id="formulaire">
<div class="section choix-profil">

  <h2>👤 Vous êtes</h2>

  <p class="texte-choix-profil">
    Choisissez votre situation :
  </p>


  <!-- PARENT -->
  <label class="carte-profil">

    <input
      type="radio"
      name="typeInscription"
      value="parent"
      checked
    >

    <div class="icone-profil">
      👨‍👩‍👧
    </div>

    <div class="contenu-profil">

      <strong>
        PARENT
      </strong>

      <span>
        Je suis le parent ou le responsable légal
        de l'enfant.
      </span>

      <small>
        Exemple : j'inscris mon ou mes propres enfants.
      </small>

    </div>

  </label>


  <!-- ASSISTANTE MATERNELLE -->
  <label class="carte-profil">

    <input
      type="radio"
      name="typeInscription"
      value="assistante"
    >

    <div class="icone-profil">
      👩‍🍼
    </div>

    <div class="contenu-profil">

      <strong>
        ASSISTANTE MATERNELLE
      </strong>

      <span>
        Je suis assistante maternelle et j'inscris
        les enfants que j'accueille.
      </span>

      <small>
        Exemple : les enfants inscrits sont ceux
        de mes parents employeurs.
      </small>

    </div>

  </label>

</div>
<div class="section">

<h2>👨 Responsable</h2>

<div class="grid">

<div>
<label>Nom</label>
<input type="text" id="nom">
</div>

<div>
<label>Prénom</label>
<input type="text" id="prenom">
</div>

<div>
<label>Téléphone</label>
<input type="tel" id="telephone">
</div>

<div>
<label>Email</label>
<input type="email" id="email">
</div>

</div>

</div>

<div class="section">

<h2>👶 Enfants</h2>

<div id="listeEnfants">

</div>

<button type="button" id="ajouterEnfant">

➕ Ajouter un enfant

</button>

</div>

<div class="section" id="blocTypePhoto">

<h2>📸 Type de séance</h2>

<select id="typePhoto">
<div id="dureeSeance">
Durée estimée : 0 minute
</div>
<option value="individuel">Photo individuelle</option>

<option value="fratrie">Photo fratrie</option>

<option value="les2">Individuelle + Fratrie</option>

</select>

</div>

<div class="section">

<h2>🕒 Créneau</h2>

<div id="creneaux">

Les créneaux apparaîtront ici.

</div>

</div>

<br>
<div class="section" id="blocSignature">

    <h2>✍️ Signature du responsable légal</h2>

    <p>
        Merci de signer dans le cadre ci-dessous.
    </p>

    <canvas
        id="signaturePad"
        width="500"
        height="180"
        style="
            border:2px solid #999;
            border-radius:8px;
            background:white;
            max-width:100%;
            touch-action:none;
        ">
    </canvas>

    <br><br>

    <button type="button" id="effacerSignature">
        🗑️ Effacer la signature
    </button>

</div>
<button type="submit">

Valider mon inscription

</button>

</form>

</div>

      

    </div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <script src="pdf-shooting.js"></script>
<script src="shooting.js"></script>

</body>
</html>
