<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Récré Du P'tit Loup</title>

<style>
*{
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  max-width:900px;
  margin:auto;
  padding:20px;
  background:#f4f7f5;
  color:#2f3a32;
}

h1{
  text-align:center;
  color:#3d7653;
  margin-bottom:25px;
}

h2{
  margin-top:0;

}

.card{
  background:white;
  padding:25px;
  border-radius:18px;
  margin-top:20px;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
}

input,
select{
  width:100%;
  padding:13px 14px;
  margin-bottom:12px;
  border:1px solid #cfd8d1;
  border-radius:10px;
  font-size:16px;

}

input:focus,
select:focus{
  outline:none;

}

button{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

#submitBtn{
  background:#4f8b62;
  color:white;
  margin-top:10px;
}

#submitBtn:hover{
  background:#3f7350;
}

#submitBtn:disabled{
  background:#aaa;
  cursor:not-allowed;
}

button[type="button"]{
  background:#eeeeee;
  color:#444;
}

button[type="button"]:hover{
  background:#e0e0e0;
}

#infoType{
  padding:10px 12px;
  border-radius:8px;
  background:#f1f7f3;
  color:#4f6657 !important;
  margin-top:0 !important;
  margin-bottom:15px !important;
}

#dates{
  margin-top:15px;
}

.date-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:15px;
  margin-bottom:12px;
  border:1px solid #d9dfda;
  border-radius:12px;
  background:white;
  transition:.2s;
}

.date-item:hover{
  border-color:#8ab496;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.date-item > div{
  display:flex;
  align-items:center;
  gap:12px;
  flex:1;
}

.date-item input[type="checkbox"]{
  width:22px;
  height:22px;
  margin:0;
  accent-color:#4f8b62;
  flex-shrink:0;
}

.date-texte{
  font-size:17px;
  font-weight:bold;
  line-height:1.3;
  text-transform:capitalize;
}

.place{
  min-width:175px;
  text-align:right;
  font-size:15px;
  font-weight:bold;
  color:#2e7d32;
}

.date-item.bloquee{
  background:#fff1f1;
  border:1px solid #e49b9b;
  opacity:.8;
}

.date-item.bloquee input[type="checkbox"]{
  display:none;
}

.date-item.bloquee .date-texte::before{
  content:"🔒 ";
}

#message{
  margin-top:15px;
  font-size:16px;
  font-weight:bold;
  text-align:center;
}

@media (max-width:600px){

  body{
    padding:10px;
  }

  .card{
    padding:17px;
  }

  h1{
    font-size:25px;
  }

  .date-item{
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
  }

  .date-item > div{
    width:100%;
  }

  .date-texte{
    font-size:18px;
  }

  .place{
    min-width:0;
    width:100%;
    text-align:left;
    padding-left:34px;
    font-size:15px;
  }

}
</style>
</head>

<script>

const SUPABASE_URL =
"https://jbialegbayusckjjajnq.supabase.co";

const SUPABASE_KEY =
"sb_publishable__buDYmorRpoNxxjFGq56Iw_28SaX6IG";

const { createClient } = supabase;

const client =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let datesAnnulees = [];

async function chargerDatesAnnulees(){

  const { data, error } =
  await client
  .from("dates_annulees")
  .select("date");

  if(error){
    console.error(error);
    return;
  }

  datesAnnulees =
  data.map(x => x.date);

}

function genererDates(){

const bloc =
document.getElementById("dates");

bloc.innerHTML = "";

const moisSelectionne =
document.getElementById("mois").value;

let debut =
new Date(moisSelectionne + "-01");

let fin =
new Date(
debut.getFullYear(),
debut.getMonth() + 1,
0
);

while(debut <= fin){

const jour =
debut.getDay();

if(
jour===1 ||
jour===2 ||
jour===4
){

const iso =
debut.toISOString().split("T")[0];
const aujourdHui =
new Date();

aujourdHui.setHours(
0,0,0,0
);

if(debut < aujourdHui){

  debut.setDate(
    debut.getDate()+1
  );

  continue;
}
if(!datesAnnulees.includes(iso)){

const texte =
debut.toLocaleDateString(
"fr-FR",
{
weekday:"long",
day:"numeric",
month:"long"
}
);

bloc.innerHTML += `
<label class="date-item">
<div>
<input
type="checkbox"
value="${iso}">
<span class="date-texte">${texte}</span>
</div>

<span
class="place"
id="places-${iso}">
...
</span>
</label>
`;
}
}

debut.setDate(
debut.getDate()+1
);
}
}
document.addEventListener(
  "change",
  function(e){

    if(
      e.target.matches(
        "#dates input[type='checkbox']"
      )
    ){
      gererBlocageAssistante();
    }

    if(
      e.target.id ===
      "typeParticipant"
    ){
      gererBlocageAssistante();
    }

  }
);
async function afficherPlaces(){

const cases =
document.querySelectorAll(
"#dates input[type='checkbox']"
);

for(const c of cases){

const date = c.value;

const { count } =
await client
.from("inscriptions")
.select("*",{
count:"exact",
head:true
})
.eq("seance",date);

const restant =
Math.max(
0,
30-(count||0)
);

const zone =
document.getElementById(
`places-${date}`
);

if(zone){

  if(restant <= 0){

    c.disabled = true;
    c.dataset.complet = "oui";

    zone.innerHTML =
    "❌ Complet";

  }
  else if(restant <= 5){

    c.dataset.complet = "non";

    const inscrits =
    count || 0;

    zone.innerHTML =
    "⚠️ " +
    inscrits +
    "/30 inscrits (" +
    restant +
    " places)";

  }
  else{

    c.dataset.complet = "non";

    const inscrits =
    count || 0;

    zone.innerHTML =
    inscrits +
    "/30 inscrits (" +
    restant +
    " places)";

  }

}

}

gererBlocageAssistante();

}
function gererBlocageAssistante(){

  const type =
  document.getElementById(
    "typeParticipant"
  ).value;

  const cases =
  document.querySelectorAll(
    "#dates input[type='checkbox']"
  );

  // Réactive tout
  cases.forEach(c => {

    if(c.dataset.complet !== "oui"){
      c.disabled = false;
    }

    c.closest(".date-item").classList.remove("bloquee");

  });
  // Blocage des mardis pour les parents
if(type === "parent"){

    cases.forEach(c=>{

        const jour = new Date(c.value).getDay();

        if(jour === 2){ // Mardi

            c.disabled = true;

            c.closest(".date-item")
             .classList.add("bloquee");

        }

    });

    return;

}

  if(type !== "assistante_maternelle"){
    return;
  }

  const cochees =
  [...cases].filter(c => c.checked);

  if(cochees.length === 0){
    return;
  }

  const semainesOccupees = [];

  cochees.forEach(c => {

    const d = new Date(c.value);

    const debutSemaine =
    new Date(d);

    debutSemaine.setDate(
      d.getDate() - d.getDay() + 1
    );

    const cle =
    debutSemaine
    .toISOString()
    .split("T")[0];

    semainesOccupees.push(cle);

  });

  cases.forEach(c => {

    if(c.checked){
      return;
    }

    const d = new Date(c.value);

    const debutSemaine =
    new Date(d);

    debutSemaine.setDate(
      d.getDate() - d.getDay() + 1
    );

    const cle =
    debutSemaine
    .toISOString()
    .split("T")[0];

    if(semainesOccupees.includes(cle)){

      c.disabled = true;

      c.closest(".date-item").classList.add("bloquee");

    }

  });

}
  function mettreAJourRecap(){

  const zone =
  document.getElementById("recap");

  const enfants = [
    document.getElementById("kid1").value.trim(),
    document.getElementById("kid2").value.trim(),
    document.getElementById("kid3").value.trim(),
    document.getElementById("kid4").value.trim()
  ].filter(x => x !== "");

  const dates =
  [...document.querySelectorAll(
    "#dates input[type='checkbox']:checked"
  )];

  if(
    enfants.length === 0 &&
    dates.length === 0
  ){
    zone.style.display = "none";
    zone.innerHTML = "";
    return;
  }

  let html =
  "<strong>📋 Récapitulatif</strong><br><br>";

  if(enfants.length > 0){

    html +=
    "👶 " +
    enfants.length +
    (enfants.length > 1
      ? " enfants"
      : " enfant") +
    "<br>";

  }

  if(dates.length > 0){

    html +=
    "📅 " +
    dates.length +
    (dates.length > 1
      ? " séances sélectionnées"
      : " séance sélectionnée") +
    "<br><br>";

    dates.forEach(c => {

      const texte =
      c.closest(".date-item")
      .querySelector(".date-texte")
      .textContent;

      html +=
      "• " +
      texte +
      "<br>";

    });

  }

  if(
    enfants.length > 0 &&
    dates.length > 0
  ){

    html +=
    "<br><strong>" +
    (enfants.length * dates.length) +
    " place(s) au total</strong>";

  }

  zone.innerHTML = html;
  zone.style.display = "block";

}
  document
.querySelectorAll(
  "#kid1,#kid2,#kid3,#kid4"
)
.forEach(input => {

  input.addEventListener(
    "input",
    mettreAJourRecap
  );

});

document.addEventListener(
  "change",
  function(e){

    if(
      e.target.matches(
        "#dates input[type='checkbox']"
      )
    ){
      mettreAJourRecap();
    }

  }
);
async function envoyerInscription(){

  const submitBtn =
  document.getElementById("submitBtn");

  submitBtn.disabled = true;
  submitBtn.textContent =
  "⏳ Inscription en cours...";


  // ==========================================
  // INFORMATIONS DU FORMULAIRE
  // ==========================================

  const nom =
  document
  .getElementById("nom")
  .value
  .trim();

  const prenom =
  document
  .getElementById("prenom")
  .value
  .trim();

  const accompagnateur =
  nom + " " + prenom;

  const email =
  document
  .getElementById("email")
  .value
  .trim();

  const typeParticipant =
  document
  .getElementById("typeParticipant")
  .value;

  const enfants = [
    kid1.value.trim(),
    kid2.value.trim(),
    kid3.value.trim(),
    kid4.value.trim()
  ].filter(x => x !== "");

  const dates =
  Array.from(
    document.querySelectorAll(
      "#dates input:checked"
    )
  ).map(x => x.value);


  // ==========================================
  // RÉACTIVER LE BOUTON
  // ==========================================

  function reactiverBouton(){

    submitBtn.disabled = false;

    submitBtn.textContent =
    "✅ Envoyer mon inscription";

  }


  // ==========================================
  // VÉRIFICATION DU FORMULAIRE
  // ==========================================

  if(
    !nom ||
    !prenom ||
    !email ||
    enfants.length === 0 ||
    dates.length === 0
  ){

    document.getElementById(
      "message"
    ).innerHTML =
    "❌ Merci de remplir les informations obligatoires et de sélectionner au moins une séance.";

    reactiverBouton();

    return;
  }


  // ==========================================
  // FONCTION : LUNDI DE LA SEMAINE
  // ==========================================

  function obtenirLundi(dateISO){

    const d =
    new Date(
      dateISO + "T12:00:00"
    );

    const jour =
    d.getDay();

    const decalage =
    jour === 0
    ? -6
    : 1 - jour;

    d.setDate(
      d.getDate() + decalage
    );

    d.setHours(
      12,0,0,0
    );

    return d;
  }


  // ==========================================
  // DONNÉES EXISTANTES DE L'ASSISTANTE
  // ==========================================

  let inscriptionsAssistante = [];

  if(
    typeParticipant ===
    "assistante_maternelle"
  ){

    const {
      data,
      error
    } =
    await client
    .from("inscriptions")
    .select(
      "seance, statut, type_participant"
    )
    .eq(
      "email",
      email
    )
    .eq(
      "type_participant",
      "assistante_maternelle"
    );

    if(error){

      console.error(error);

      document.getElementById(
        "message"
      ).innerHTML =
      "❌ Impossible de vérifier les inscriptions déjà existantes.";

      reactiverBouton();

      return;
    }

    inscriptionsAssistante =
    data || [];

  }


  // ==========================================
  // UNE SEULE SÉANCE PAR SEMAINE
  // PARMI LES DATES COCHÉES
  // ==========================================

  if(
    typeParticipant ===
    "assistante_maternelle"
  ){

    const semainesChoisies =
    new Set();

    for(const date of dates){

      const lundi =
      obtenirLundi(date);

      const cle =
      lundi
      .toISOString()
      .split("T")[0];

      if(
        semainesChoisies.has(cle)
      ){

        document.getElementById(
          "message"
        ).innerHTML =
        "❌ Une assistante maternelle ne peut réserver qu'une seule séance par semaine.";

        reactiverBouton();

        return;
      }

      semainesChoisies.add(cle);

    }


    // ========================================
    // Vérifie qu'elle n'a pas déjà
    // une inscription ou une demande
    // cette même semaine
    // ========================================

    for(const date of dates){

      const lundiChoisi =
      obtenirLundi(date);

      const dejaCetteSemaine =
      inscriptionsAssistante.some(
        inscription => {

          const lundiExistant =
          obtenirLundi(
            inscription.seance
          );

          return (
            lundiExistant.getTime() ===
            lundiChoisi.getTime()
          );

        }
      );

      if(dejaCetteSemaine){

        document.getElementById(
          "message"
        ).innerHTML =
        "❌ Cette assistante maternelle possède déjà une inscription ou une demande pour cette semaine.";

        reactiverBouton();

        return;
      }

    }

  }


  // ==========================================
  // PRÉPARATION
  // ==========================================

  const inscriptions = [];

  const datesConfirmees = [];
  const datesEnAttente = [];


  // ==========================================
  // TRAITEMENT DE CHAQUE DATE
  // ==========================================

  for(const date of dates){

    let statutInscription =
    "Inscrit";


    // ========================================
    // DÉTECTION DE LA SEMAINE PRÉCÉDENTE
    // ========================================

    if(
      typeParticipant ===
      "assistante_maternelle"
    ){

      const lundiChoisi =
      obtenirLundi(date);

      const lundiPrecedent =
      new Date(lundiChoisi);

      lundiPrecedent.setDate(
        lundiPrecedent.getDate() - 7
      );


      const aBeneficieSemainePrecedente =
      inscriptionsAssistante.some(
        inscription => {

          // Une demande "En attente"
          // ne compte pas comme séance bénéficiée

          if(
            inscription.statut ===
            "En attente"
          ){
            return false;
          }

          const lundiInscription =
          obtenirLundi(
            inscription.seance
          );

          return (
            lundiInscription.getTime() ===
            lundiPrecedent.getTime()
          );

        }
      );


      if(
        aBeneficieSemainePrecedente
      ){

        statutInscription =
        "En attente";

      }

    }


    // ========================================
    // CAPACITÉ TOTALE
    // Les "En attente" ne comptent pas
    // ========================================

    const {
      data: inscriptionsDate,
      error: erreurPlaces
    } =
    await client
    .from("inscriptions")
    .select("statut")
    .eq(
      "seance",
      date
    );

    if(erreurPlaces){

      console.error(
        erreurPlaces
      );

      document.getElementById(
        "message"
      ).innerHTML =
      "❌ Impossible de vérifier les places disponibles.";

      reactiverBouton();

      return;
    }


    const nombrePlacesOccupees =
    (inscriptionsDate || [])
    .filter(
      ligne =>
      ligne.statut !==
      "En attente"
    )
    .length;


    const placesRestantes =
    Math.max(
      0,
      30 -
      nombrePlacesOccupees
    );


    // Même une demande en attente
    // n'est pas enregistrée si
    // la séance est déjà totalement pleine

    if(
      placesRestantes <
      enfants.length
    ){

      const dateFR =
      new Date(
        date + "T12:00:00"
      ).toLocaleDateString(
        "fr-FR",
        {
          weekday:"long",
          day:"numeric",
          month:"long"
        }
      );

      document.getElementById(
        "message"
      ).innerHTML =
      `❌ Il ne reste que ${placesRestantes} place(s) pour la séance du ${dateFR}.`;

      reactiverBouton();

      return;
    }


    // ========================================
    // JOUR DE LA SÉANCE
    // ========================================

    const jourSeance =
    new Date(
      date + "T12:00:00"
    ).getDay();


    // ========================================
    // QUOTA 20 ENFANTS AM
    // uniquement lundi et jeudi
    //
    // Les demandes en attente
    // ne comptent PAS dans les 20.
    // ========================================

    if(
      typeParticipant ===
      "assistante_maternelle"
      &&
      (
        jourSeance === 1 ||
        jourSeance === 4
      )
    ){

      const {
        data: inscriptionsAM,
        error: erreurAssistantes
      } =
      await client
      .from("inscriptions")
      .select("statut")
      .eq(
        "seance",
        date
      )
      .eq(
        "type_participant",
        "assistante_maternelle"
      );

      if(erreurAssistantes){

        console.error(
          erreurAssistantes
        );

        document.getElementById(
          "message"
        ).innerHTML =
        "❌ Impossible de vérifier les places des assistantes maternelles.";

        reactiverBouton();

        return;
      }


      const nombreEnfantsAMConfirmes =
      (inscriptionsAM || [])
      .filter(
        ligne =>
        ligne.statut !==
        "En attente"
      )
      .length;


      const placesAssistantesRestantes =
      Math.max(
        0,
        20 -
        nombreEnfantsAMConfirmes
      );


      if(
        placesAssistantesRestantes <
        enfants.length
      ){

        const dateFR =
        new Date(
          date + "T12:00:00"
        ).toLocaleDateString(
          "fr-FR",
          {
            weekday:"long",
            day:"numeric",
            month:"long"
          }
        );


        if(
          placesAssistantesRestantes ===
          0
        ){

          document.getElementById(
            "message"
          ).innerHTML =
          `❌ Les 20 places pour les enfants des assistantes maternelles sont déjà prises pour le ${dateFR}.`;

        }
        else{

          document.getElementById(
            "message"
          ).innerHTML =
          `❌ Il ne reste que ${placesAssistantesRestantes} place(s) pour les enfants des assistantes maternelles le ${dateFR}.`;

        }

        reactiverBouton();

        return;
      }

    }


    // ========================================
    // MÉMORISER LE TYPE D'INSCRIPTION
    // ========================================

    if(
      statutInscription ===
      "En attente"
    ){

      datesEnAttente.push(date);

    }
    else{

      datesConfirmees.push(date);

    }


    // ========================================
    // CRÉER UNE LIGNE PAR ENFANT
    // ========================================

    enfants.forEach(enfant => {

      inscriptions.push({

        accompagnateur,

        email,

        type_participant:
        typeParticipant,

        enfant,

        seance:
        date,

        statut:
        statutInscription

      });

    });

  }


  // ==========================================
  // ENREGISTREMENT SUPABASE
  // ==========================================

  const { error } =
  await client
  .from("inscriptions")
  .insert(inscriptions);

  if(error){

    console.error(error);

    document.getElementById(
      "message"
    ).innerHTML =
    "❌ Erreur lors de l'enregistrement : " +
    error.message;

    reactiverBouton();

    return;
  }


  // ==========================================
  // EMAIL DES INSCRIPTIONS CONFIRMÉES
  // ==========================================

  if(
    datesConfirmees.length > 0
  ){

    try{

      const response =
      await fetch(
        "/api/send-email",
        {
          method:"POST",

          headers:{
            "Content-Type":
            "application/json"
          },

          body:JSON.stringify({

            email,

            accompagnateur,

            enfants,

            dates:
            datesConfirmees,

            statut:
            "Inscrit"

          })

        }
      );

      if(!response.ok){

        console.error(
          "Erreur e-mail confirmation"
        );

      }

    }
    catch(error){

      console.error(
        "Erreur e-mail confirmation :",
        error
      );

    }

  }


  // ==========================================
  // EMAIL DES DEMANDES EN ATTENTE
  // ==========================================

  if(
    datesEnAttente.length > 0
  ){

    try{

      const response =
      await fetch(
        "/api/send-email",
        {
          method:"POST",

          headers:{
            "Content-Type":
            "application/json"
          },

          body:JSON.stringify({

            email,

            accompagnateur,

            enfants,

            dates:
            datesEnAttente,

            statut:
            "En attente"

          })

        }
      );

      if(!response.ok){

        console.error(
          "Erreur e-mail attente"
        );

      }

    }
    catch(error){

      console.error(
        "Erreur e-mail attente :",
        error
      );

    }

  }


  // ==========================================
  // MESSAGE AFFICHÉ SUR LE SITE
  // ==========================================

  if(
    datesEnAttente.length > 0
    &&
    datesConfirmees.length === 0
  ){

    document.getElementById(
      "message"
    ).innerHTML =
    "🕐 Votre demande a bien été enregistrée.<br><br>" +
    "Vous avez bénéficié d'une séance la semaine précédente. " +
    "Afin de permettre le roulement entre les assistantes maternelles, " +
    "<b>votre demande est en attente de validation par l'association.</b><br><br>" +
    "Vous recevrez un e-mail après validation.";

  }

  else if(
    datesEnAttente.length > 0
    &&
    datesConfirmees.length > 0
  ){

    document.getElementById(
      "message"
    ).innerHTML =
    "✅ Certaines séances sont confirmées.<br>" +
    "🕐 Certaines demandes sont en attente de validation.<br><br>" +
    "Consultez les e-mails reçus pour connaître le détail.";

  }

  else{

    document.getElementById(
      "message"
    ).innerHTML =
    "✅ Inscription enregistrée avec succès ! Un e-mail de confirmation vous a été envoyé.";

  }


  // ==========================================
  // VIDER LE FORMULAIRE
  // ==========================================

  document.getElementById(
    "nom"
  ).value = "";

  document.getElementById(
    "prenom"
  ).value = "";

  document.getElementById(
    "email"
  ).value = "";

  document.getElementById(
    "kid1"
  ).value = "";

  document.getElementById(
    "kid2"
  ).value = "";

  document.getElementById(
    "kid3"
  ).value = "";

  document.getElementById(
    "kid4"
  ).value = "";


  document
  .querySelectorAll(
    "#dates input:checked"
  )
  .forEach(x => {

    x.checked = false;

  });


  // ==========================================
  // ACTUALISER LE SITE
  // ==========================================

  await afficherPlaces();

  gererBlocageAssistante();


  if(
    typeof mettreAJourRecap ===
    "function"
  ){

    mettreAJourRecap();

  }


  reactiverBouton();

}

async function genererPDF() {

  const dateChoisie = prompt(
    "Entrez la date (AAAA-MM-JJ)"
  );

  if (!dateChoisie) return;

  const { data, error } = await client
    .from("inscriptions")
    .select("*")
    .eq("seance", dateChoisie)
    .order("accompagnateur");

  if (error) {
    alert("Erreur : " + error.message);
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFontSize(18);
  doc.text(
    "La Récré Du P'tit Loup",
    20,
    20
  );

  doc.setFontSize(12);
  doc.text(
    "Feuille de présence",
    20,
    30
  );

  doc.text(
    "Date : " + dateChoisie,
    20,
    40
  );

  let y = 55;

  doc.text(
    "Présent   Accompagnateur - Enfant",
    20,
    y
  );

  y += 10;

  data.forEach((ligne) => {

    doc.text(
      "[ ] " +
      ligne.accompagnateur +
      " - " +
      ligne.enfant,
      20,
      y
    );

    y += 8;

    if (y > 270) {
      doc.addPage();
      y = 20;
    }

  });

  doc.text(
    "Nombre total d'enfants : " +
    data.length,
    20,
    y + 10
  );

  doc.save(
    "presence-" +
    dateChoisie +
    ".pdf"
  );
}
